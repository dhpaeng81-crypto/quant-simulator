# 데이터 수집 → 테스트 → 빌드 → GitHub Pages 배포
# 처음 한 번: 저장소 Settings → Pages → Build and deployment → Source를 "GitHub Actions"로 설정
name: 데이터 갱신 및 배포

on:
  schedule:
    # 장 마감 후 (종가·투자자별 매매 반영)
    - cron: "40 7 * * 1-5" # 평일 16:40 KST
    # 장 시작 전 전망: GitHub 예약 실행은 몇 시간씩 늦는 일이 많아 저녁·새벽에 여러 번 걸어 두고,
    # 먼저 시작된 실행이 GitHub 안에서 08:05 KST까지 기다렸다가 수집·배포 (scripts/preopen_wait.py)
    - cron: "20 11 * * 0-4" # 20:20 KST
    - cron: "20 14 * * 0-4" # 23:20 KST
    - cron: "20 17 * * 0-4" # 02:20 KST
    - cron: "20 20 * * 0-4" # 05:20 KST
    - cron: "20 22 * * 0-4" # 07:20 KST
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # 장 시작 전 예약 실행일 때만: 08:05 KST까지 대기 (너무 이르거나 이미 배포됐으면 건너뜀)
  wait:
    if: github.event_name == 'schedule' && github.event.schedule != '40 7 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: preopen
      cancel-in-progress: false
    outputs:
      go: ${{ steps.wait.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/preopen_wait.py
          sparse-checkout-cone-mode: false
      - id: wait
        run: python3 -I scripts/preopen_wait.py

  build:
    needs: wait
    # 장전 예약이 아니면(대기 작업 건너뜀) 바로, 장전 예약이면 대기 결과가 진행일 때만
    if: ${{ !cancelled() && (needs.wait.result == 'skipped' || needs.wait.outputs.go == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - name: 데이터 수집 (실패 비율이 30%를 넘으면 중단 → 이전 배포 유지)
        run: npm run collect
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # 앞의 wait 작업이 건너뛰어지면 GitHub는 뒤 작업도 기본으로 건너뜀 → 빌드 성공이면 배포하도록 명시
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 분봉 쌓기: 끝난 거래일의 1분 가격을 minute-data 브랜치에 저장 (사이트 배포와 별개)
  minute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 저장 브랜치 준비
        run: |
          if git ls-remote --exit-code --heads origin minute-data >/dev/null; then
            git fetch --depth=1 origin minute-data:minute-data
            git worktree add store minute-data
          else
            git worktree add --orphan -b minute-data store
          fi
      - name: 분봉 수집 (최근 7거래일 중 빠진 날만)
        run: npm run collect:minute -- store
      - name: 저장
        run: |
          cd store
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "새로 저장할 날 없음"
          else
            git commit -m "분봉 저장 $(date -u +%F)"
            git push origin minute-data
          fi
