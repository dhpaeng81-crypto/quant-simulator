# 데이터 수집 → 테스트 → 빌드 → GitHub Pages 배포
# 처음 한 번: 저장소 Settings → Pages → Build and deployment → Source를 "GitHub Actions"로 설정
name: 데이터 갱신 및 배포

on:
  schedule:
    - cron: "40 7 * * 1-5" # 평일 16:40 KST (국내 장 마감 후: 종가·투자자별 매매 반영)
    - cron: "20 22 * * 0-4" # 평일 07:20 KST (미국 장 마감 후, 국내 장 시작 전)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - name: 데이터 수집 (실패 비율이 30%를 넘으면 중단 → 이전 배포 유지)
        run: npm run collect
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 분봉 쌓기: 끝난 거래일의 1분 가격을 minute-data 브랜치에 저장 (사이트 배포와 별개)
  minute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 저장 브랜치 준비
        run: |
          if git ls-remote --exit-code --heads origin minute-data >/dev/null; then
            git fetch --depth=1 origin minute-data:minute-data
            git worktree add store minute-data
          else
            git worktree add --orphan -b minute-data store
          fi
      - name: 분봉 수집 (최근 7거래일 중 빠진 날만)
        run: npm run collect:minute -- store
      - name: 저장
        run: |
          cd store
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "새로 저장할 날 없음"
          else
            git commit -m "분봉 저장 $(date -u +%F)"
            git push origin minute-data
          fi
