# 데이터 수집 → 테스트 → 빌드 → GitHub Pages 배포
# 처음 한 번: 저장소 Settings → Pages → Build and deployment → Source를 "GitHub Actions"로 설정
name: 데이터 갱신 및 배포

on:
  schedule:
    - cron: "40 7 * * 1-5" # 평일 16:40 KST (국내 장 마감 후: 종가·투자자별 매매 반영)
    - cron: "20 22 * * 0-4" # 평일 07:20 KST (미국 장 마감 후, 국내 장 시작 전)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - name: 데이터 수집 (실패 비율이 30%를 넘으면 중단 → 이전 배포 유지)
        run: npm run collect
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
